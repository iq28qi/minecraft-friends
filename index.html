<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Server & Mods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.9);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --btn-secondary: #21262d;
      --btn-secondary-hover: #30363d;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #1a2333 0%, var(--bg) 80%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 35px var(--accent-glow);
      position: relative;
    }

    .header { text-align: center; margin-bottom: 24px; }
    .tag {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent);
      background: rgba(16, 185, 129, 0.12);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .header h1 { font-size: 26px; font-weight: 800; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 10px;
      border: 1px solid var(--card-border);
    }

    .indicator { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
    .indicator.online { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

    .info-card {
      background: rgba(13, 17, 23, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
    .info-value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; color: #fff; }

    .copy-btn {
      background: var(--btn-secondary);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .copy-btn:hover { background: var(--btn-secondary-hover); }
    .copy-btn.copied { background: var(--accent); color: #000; }

    .divider { height: 1px; background: var(--card-border); margin: 24px 0; }

    .downloads-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: center;
    }

    .btn-main {
      width: 100%;
      background: var(--accent);
      color: #0d1117;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: 0.2s;
      margin-bottom: 10px;
    }
    .btn-main:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .btn-sub {
      background: var(--btn-secondary);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      transition: 0.2s;
    }
    .btn-sub:hover { background: var(--btn-secondary-hover); }

    .admin-toggle {
      position: absolute;
      top: 18px;
      right: 18px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      opacity: 0.5;
    }
    .admin-toggle:hover { opacity: 1; }

    .edit-modal {
      display: none;
      margin-top: 16px;
      background: rgba(0, 0, 0, 0.4);
      padding: 16px;
      border-radius: 14px;
      border: 1px dashed var(--card-border);
    }
    .edit-modal.active { display: block; }

    .input-field {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="admin-toggle" id="toggleEdit" title="Изменить IP/Порт">⚙️</button>

    <div class="header">
      <span class="tag">Minecraft Server</span>
      <h1>⚡ НАШ СЕРВЕР</h1>
      <div class="status-badge">
        <div class="indicator" id="statusIndicator"></div>
        <span id="statusText">Загрузка...</span>
        <span id="playerCount" style="color: var(--text-muted); font-size: 12px;"></span>
      </div>
    </div>

    <!-- IP & PORT -->
    <div class="info-card">
      <div>
        <div class="info-label">IP Адрес</div>
        <div class="info-value" id="ipValue">...</div>
      </div>
      <button class="copy-btn" onclick="copyText('ipValue', this)">Копировать</button>
    </div>

    <div class="info-card">
      <div>
        <div class="info-label">Порт</div>
        <div class="info-value" id="portValue">...</div>
      </div>
      <button class="copy-btn" onclick="copyText('portValue', this)">Копировать</button>
    </div>

    <!-- Редактирование -->
    <div class="edit-modal" id="editModal">
      <div class="info-label" style="margin-bottom: 8px;">Обновить адрес в Cloudflare KV:</div>
      <input type="text" id="inputIp" class="input-field" placeholder="IP или домен (например, 95.21.33.10)">
      <input type="text" id="inputPort" class="input-field" placeholder="Порт (например, 25565)">
      <button class="btn-main" style="margin-bottom: 0; padding: 10px;" onclick="saveToServer()">Сохранить для всех</button>
    </div>

    <div class="divider"></div>

    <!-- Загрузка файлов -->
    <div class="downloads-title">📦 Файлы сборки</div>
    
    <!-- Замени ссылки на свои (Яндекс Диск / Google Drive) -->
    <a href="https://disk.yandex.ru/YOUR_FULL_ZIP" id="fullZipLink" target="_blank" class="btn-main">
      <span>⬇</span> СКАЧАТЬ ВСЮ СБОРКУ (.ZIP)
    </a>

    <div class="btn-grid">
      <a href="https://disk.yandex.ru/YOUR_MODS" target="_blank" class="btn-sub">📁 Моды</a>
      <a href="https://disk.yandex.ru/YOUR_CONFIGS" target="_blank" class="btn-sub">⚙️ Конфиги</a>
      <a href="https://disk.yandex.ru/YOUR_SHADERS" target="_blank" class="btn-sub">✨ Шейдеры</a>
    </div>
  </div>

  <script>
    const API_URL = "https://mc-api.dimitrytam09.workers.dev/api/server";

    // Получение данных из Cloudflare Worker при открытии
    async function loadServerData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        document.getElementById('ipValue').textContent = data.ip;
        document.getElementById('portValue').textContent = data.port;
        document.getElementById('inputIp').value = data.ip;
        document.getElementById('inputPort').value = data.port;

        if (data.modsUrl && data.modsUrl.startsWith('http')) {
          document.getElementById('fullZipLink').href = data.modsUrl;
        }

        checkServer(data.ip, data.port);
      } catch (e) {
        document.getElementById('statusText').textContent = "Ошибка API";
      }
    }

    // Сохранение нового IP/порта в базу данных
    async function saveToServer() {
      const newIp = document.getElementById('inputIp').value.trim();
      const newPort = document.getElementById('inputPort').value.trim();
      const password = prompt("Введи пароль администратора (по умолчанию: admin12345):");

      if (!password) return;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${password}`
          },
          body: JSON.stringify({ ip: newIp, port: newPort })
        });

        if (res.ok) {
          alert("Данные успешно сохранены в Cloudflare!");
          document.getElementById('editModal').classList.remove('active');
          loadServerData();
        } else {
          alert("Ошибка сохранения: неверный пароль.");
        }
      } catch (e) {
        alert("Ошибка сети при отправке запроса.");
      }
    }

    // Проверка статуса сервера
    async function checkServer(ip, port) {
      const indicator = document.getElementById('statusIndicator');
      const statusText = document.getElementById('statusText');
      const playerCount = document.getElementById('playerCount');

      statusText.textContent = "Опрос сервера...";
      indicator.className = "indicator";

      try {
        const res = await fetch(`https://api.mcstatus.io/v2/status/java/${ip}:${port}`);
        const data = await res.json();

        if (data.online) {
          indicator.classList.add('online');
          statusText.textContent = "ONLINE";
          playerCount.textContent = `• Игроков: ${data.players.online}/${data.players.max}`;
        } else {
          indicator.className = "indicator";
          statusText.textContent = "OFFLINE";
          playerCount.textContent = "";
        }
      } catch (e) {
        statusText.textContent = "OFFLINE / НЕИЗВЕСТНО";
        playerCount.textContent = "";
      }
    }

    // Копирование текста
    function copyText(elementId, btn) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        const oldText = btn.textContent;
        btn.textContent = 'Скопировано!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = oldText;
          btn.classList.remove('copied');
        }, 1500);
      });
    }

    document.getElementById('toggleEdit').addEventListener('click', () => {
      document.getElementById('editModal').classList.toggle('active');
    });

    loadServerData();
  </script>
</body>
</html>
